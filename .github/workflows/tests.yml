name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test
        run: python -W error -m unittest discover -s tests -t . -v

      - name: Validate config and schema
        run: |
          python -c "import json, collect; collect.load_config(collect.ROOT / 'config.json'); json.load(open('schema/summary.schema.json'))"
